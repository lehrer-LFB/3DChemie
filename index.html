<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D-Chemie: Reaktionsmechanismen</title>
  <style>
    :root {
      --bg: #141a2a;
      --card: rgba(16, 22, 38, 0.88);
      --fg: #e8edf7;
      --muted: #8fa0c0;
      --accent: #2f6fde;
      --active: #ff7a1a;
      --done: #2e7d5b;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .side { position: absolute; top: 16px; left: 16px; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 150px);
      display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
    .side > * { pointer-events: auto; }
    .card { min-height: 0; flex: 0 1 auto; overflow: auto; background: var(--card); border-radius: 14px; padding: 14px 18px; box-sizing: border-box;
      backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    .reaction { color: #8fb4ff; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 0; margin: 10px 0; list-style: none; counter-reset: s; }
    .steps li { min-width: 0; font-size: 10.5px; line-height: 1.25; text-align: center; padding: 5px 2px; border-radius: 6px; background: #2a3350;
      counter-increment: s; overflow-wrap: anywhere; hyphens: auto; }
    .steps li::before { content: counter(s) ". "; }
    .steps li.active { background: var(--active); }
    .steps li.done { background: var(--done); }
    h2 { font-size: 18px; margin: 6px 0; }
    #ui-text { margin: 6px 0; color: #dfe6f5; }
    .guidance { color: #9be7b0; font-weight: 600; margin: 8px 0 0; }
    .hint { color: #ffb74d; font-weight: 600; margin: 6px 0 0; }
    .hint:empty, .guidance:empty, #ui-text:empty { display: none; }
    .counts { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .toolbar { position: absolute; left: 16px; right: 16px; bottom: 44px; display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbar button { background: #2a3350; color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    .toolbar button:hover { background: #3a4670; }
    .toolbar button.on { background: var(--accent); }
    .toolbar button:disabled { opacity: .4; cursor: default; }
    .controls { flex: none; align-self: flex-start; background: var(--card); border-radius: 14px;
      padding: 12px 16px 14px; box-sizing: border-box; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35);
      border: 1px solid rgba(143,180,255,.35); }
    .controls header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .controls h3 { margin: 0; font-size: 15px; color: #8fb4ff; text-transform: uppercase; letter-spacing: .05em; }
    .controls header button { background: #2a3350; color: #fff; border: 0; border-radius: 8px; padding: 4px 10px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
    .controls header button:hover { background: #3a4670; }
    .controls dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0; align-items: center; }
    .controls dt { white-space: nowrap; text-align: right; }
    .controls dd { margin: 0; font-size: 14px; white-space: nowrap; }
    .controls .group { grid-column: 1 / -1; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
    kbd { display: inline-block; min-width: 1.2em; padding: 2px 7px; border-radius: 6px; background: #e8edf7; color: #141a2a;
      font: 700 12px system-ui, sans-serif; text-align: center; box-shadow: 0 2px 0 #8fa0c0; }
    .controls.collapsed { padding: 0; border: 0; background: none; box-shadow: none; backdrop-filter: none; }
    .controls.collapsed h3, .controls.collapsed dl { display: none; }
    .controls.collapsed header { margin: 0; }
    .controls.collapsed header button { padding: 10px 16px; font-size: 14px; border-radius: 10px; background: var(--accent); }
    .level-badge { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    [hidden] { display: none !important; }
    .chooser { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,14,26,.72);
      backdrop-filter: blur(4px); z-index: 1000; padding: 16px; box-sizing: border-box; }
    .chooser-box { background: #182038; border-radius: 18px; padding: 26px 28px; max-width: 720px; width: 100%;
      box-sizing: border-box; box-shadow: 0 12px 48px rgba(0,0,0,.5); border: 1px solid rgba(143,180,255,.3); }
    .chooser h1 { margin: 0 0 4px; font-size: 24px; }
    .chooser p { margin: 0 0 18px; color: var(--muted); }
    .chooser-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .chooser-options button { text-align: left; background: #2a3350; color: #fff; border: 2px solid transparent; border-radius: 14px;
      padding: 16px 18px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 4px; }
    .chooser-options button:hover { border-color: var(--accent); background: #323d63; }
    .chooser-options b { font-size: 30px; line-height: 1.1; color: #8fb4ff; }
    .chooser-options span { font-weight: 600; }
    .chooser-options small { color: #c3cde3; font-size: 13.5px; line-height: 1.4; }
    .chooser-box { max-height: calc(100vh - 32px); overflow: auto; }
    .chooser .muted { color: var(--muted); font-weight: 400; }
    .chooser-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .chooser-tiles button { text-align: left; background: #2a3350; color: #fff; border: 2px solid transparent; border-radius: 12px;
      padding: 12px 14px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 4px; }
    .chooser-tiles button:hover:not(:disabled) { border-color: var(--accent); background: #323d63; }
    .chooser-tiles button.current { border-color: var(--accent); }
    .chooser-tiles button:disabled { opacity: .45; cursor: default; }
    .chooser-tiles .tile-title { font-weight: 700; font-size: 15px; }
    .chooser-tiles small { color: #c3cde3; font-size: 12.5px; line-height: 1.35; }
    .chooser-tiles i { color: var(--muted); font-size: 12px; }
    .lk { font-style: normal; font-size: 11px; font-weight: 700; background: #ff7a1a; color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
    .chooser-back { margin-top: 16px; background: none; border: 0; color: #8fb4ff; font: 600 14px system-ui, sans-serif; cursor: pointer; padding: 4px 0; }
    @media (max-width: 560px) { .chooser-options { grid-template-columns: 1fr; } }
    body.choosing #VRButton { visibility: hidden; }
    #VRButton { top: 16px !important; bottom: auto !important; left: auto !important; right: 16px !important; }
    @media (max-height: 760px) { .controls:not(.collapsed) .group { display: none; } .controls dl { gap: 4px 12px; } }
    @media (max-width: 640px) { .card { max-height: 45vh; } .controls { display: none; } .toolbar { bottom: 16px; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
